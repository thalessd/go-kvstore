# Postgres for the integration tier. The port is deliberately unusual so it
# cannot collide with a server already running on the machine.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kvstore
      POSTGRES_USER: kvstore
      POSTGRES_PASSWORD: kvstore
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvstore -d kvstore"]
      interval: 2s
      timeout: 3s
      retries: 15
